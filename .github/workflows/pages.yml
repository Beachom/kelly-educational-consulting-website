name: Publish site

# GitHub Pages serves this site from the gh-pages branch.
# Every push to main copies main onto gh-pages so the live site updates automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gh-pages from main
        run: git push --force origin HEAD:gh-pages
